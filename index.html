<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Official NORAD Santa Tracker</title>
  <script>
    window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/";
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="css/tracker.css">
</head>
<body oncontextmenu="return false;">
  <div id="cesiumContainer"></div>
  <canvas id="snow"></canvas>

  <header id="hud">
    <div class="hud-panel" id="lastSpottedPanel">
      <div class="hud-label">Last Spotted :</div>
      <div class="hud-value" id="lastSpotted">North Pole, Arctic</div>
    </div>
    <div class="hud-panel" id="headedForPanel">
      <div class="hud-label">Headed For</div>
      <div class="hud-value" id="headedFor">—</div>
    </div>
    <div class="hud-panel" id="giftCountPanel">
      <div class="hud-label">Gifts Delivered</div>
      <div class="hud-value" id="giftsDelivered">0</div>
    </div>
  </header>

  <div id="statusBanner" class="hidden"></div>

  <div id="zoomControls">
    <button type="button" id="zoomIn" title="Zoom in">+</button>
    <button type="button" id="zoomOut" title="Zoom out">−</button>
  </div>

  <div id="loader">
    <div class="loader-inner">
      <h1>Loading</h1>
      <p>Acquiring Santa's signal…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Cesium.js"></script>
  <script src="js/app.js"></script>
  <script
    src="https://livepill.lonormal.com/livepill.js"
    data-position="bottom-left"
    data-bg="#000000"
    data-color="#ffffff"
    data-label-color="#c8c8c8"
    data-dot="#3b82f6"
    data-label="live"
    data-offset="18px"></script>
</body>
</html>
